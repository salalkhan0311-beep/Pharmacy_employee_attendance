{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card narrow">
  <p class="eyebrow">ACCOUNT SECURITY</p><h1>Change admin password</h1>
  <p class="muted">Use a unique password with at least 12 characters.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
    <label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
    <button class="button full" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
